# cargo-deny — control de cadena de suministro.
#
# NACE EL 2026-08-13. `nexus` consume `mirilla` por `git` contra el espejo local
# y no tenía nada que gobernara de dónde puede venir una dependencia. Es el mismo
# hueco que una revisión de seguridad encontró ese día en `inventario`, con
# confianza 9: lo que se protege no es la fuente que entró —de casa y fijada por
# commit inmutable— sino la SIGUIENTE.
#
# Y aquí pesa más que en otros repos: nexus ES un orquestador de bug bounty. Su
# árbol de dependencias es la superficie de una herramienta ofensiva.

[advisories]
version = 2

[licenses]
version = 2
# Ajustada al árbol real (directiva 23): una licencia nueva = rojo y se decide a
# mano. No se pre-aprueban licencias ausentes «por si acaso».
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# `mirilla` es el arnés de navegador, `dev-dependency`. Entra igual: `cargo deny`
# mira el `Cargo.lock` entero y hace bien, porque una dependencia de pruebas
# ejecuta código en la máquina de quien compila.
#
# AL ESPEJO, NO A GITHUB: allí el repositorio está vaciado y el rev sería un
# commit huérfano que deja de compilar sin aviso.
allow-git = ["file:///home/juan/espejos/mirilla.git"]
